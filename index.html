<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Formulario de Registro</title>
</head>
<body>
  <div class="container">
    <div class="card" role="region" aria-labelledby="title">
      <h1 id="title">Crear cuenta</h1>
      <p class="lead">Rellena el formulario para crear tu cuenta. Todos los campos marcados con * son obligatorios.</p>

      <form id="registrationForm" novalidate>
        <div class="row">
          <div class="col">
            <label for="firstName">Nombre *</label>
            <input type="text" id="firstName" name="firstName" required minlength="2" maxlength="50" autocomplete="given-name" placeholder="Ej. Ana" />
            <div class="error" id="err-firstName" aria-live="polite"></div>
          </div>

          <div class="col">
            <label for="lastName">Apellido *</label>
            <input type="text" id="lastName" name="lastName" required minlength="2" maxlength="50" autocomplete="family-name" placeholder="Ej. Pérez" />
            <div class="error" id="err-lastName" aria-live="polite"></div>
          </div>
        </div>

        <div>
          <label for="email">Correo electrónico *</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="tu@ejemplo.com" />
          <div class="error" id="err-email" aria-live="polite"></div>
        </div>

        <div class="row">
          <div class="col">
            <label for="password">Contraseña * <span class="small">(mín. 8 caracteres)</span></label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="********" />
            <div class="error" id="err-password" aria-live="polite"></div>
          </div>

          <div class="col">
            <label for="confirmPassword">Confirmar contraseña *</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="********" />
            <div class="error" id="err-confirmPassword" aria-live="polite"></div>
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label for="phone">Teléfono</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9+()\\-\\s]{7,20}" placeholder="Ej. +51 987 654 321" autocomplete="tel" />
            <div class="small">Formato permitido: números, +, (), - y espacios.</div>
          </div>

          <div class="col">
            <label for="dob">Fecha de nacimiento</label>
            <input type="date" id="dob" name="dob" max="2025-09-30" />
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label for="gender">Género</label>
            <select id="gender" name="gender">
              <option value="">-- Selecciona --</option>
              <option value="female">Femenino</option>
              <option value="male">Masculino</option>
              <option value="nonbinary">No binario</option>
              <option value="other">Otro</option>
              <option value="noshare">Prefiero no decirlo</option>
            </select>
          </div>

          <div class="col">
            <label for="country">País</label>
            <select id="country" name="country">
              <option value="">-- Selecciona --</option>
              <option value="PE">Perú</option>
              <option value="MX">México</option>
              <option value="ES">España</option>
              <option value="US">Estados Unidos</option>
              <option value="other">Otro</option>
            </select>
          </div>
        </div>

        <div>
          <label for="bio">Biografía (opcional)</label>
          <textarea id="bio" name="bio" rows="3" maxlength="500" placeholder="Cuéntanos brevemente sobre ti..."></textarea>
          <div class="small">Máx. 500 caracteres.</div>
        </div>

        <div class="inline">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">Acepto los <a href="#">términos y condiciones</a> *</label>
        </div>
        <div class="error" id="err-terms" aria-live="polite"></div>

        <div class="actions">
          <button type="submit">Crear cuenta</button>
          <button type="button" class="secondary" id="resetBtn">Limpiar</button>
          <div style="margin-left:auto;" class="small">¿Ya tienes cuenta? <a href="#">Iniciar sesión</a></div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
